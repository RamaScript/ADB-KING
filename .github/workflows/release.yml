name: Build and Release ADB KING

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: adb-king-windows-x64
            release_asset_name: ADB KING-windows-x64.zip
          - os: macos-15-intel
            artifact_name: adb-king-macos-x64
            release_asset_name: ADB KING-macos-x64.zip
          - os: macos-latest
            artifact_name: adb-king-macos-arm64
            release_asset_name: ADB KING-macos-arm64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build release asset
        run: python build_release.py

      - name: Optional macOS signing and notarization
        if: runner.os == 'macOS' && env.HAS_SECRETS == 'true'
        env:
          HAS_SECRETS: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT != '' && secrets.APPLE_NOTARY_APP_PASSWORD != '' }}
          APPLE_DEVELOPER_ID_APP_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT }}
          APPLE_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APP_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APP_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          bash scripts/notarize_macos_app.sh "dist/ADB KING.app" "release/${{ matrix.release_asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            TAG_NAME="v1.0.0"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # If tag doesn't exist, create it
            if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
              git tag "${TAG_NAME}"
              git push origin "${TAG_NAME}"
            fi
          fi
          # Create or update release
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Uploading/updating assets..."
            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            echo "Creating release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" release-assets/* --title "ADB KING ${TAG_NAME}" --generate-notes
          fi
